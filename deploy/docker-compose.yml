# Mystina blog en el servidor de Juan.
# Uso: copiar esta carpeta al servidor, crear .env a partir de .env.example y
#      ejecutar `docker compose up -d`. Ver deploy/GUIA_JUAN.md.
name: mystina

services:
  web:
    image: ghcr.io/crisoriano/mystina:latest
    container_name: mystina-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mystina:${POSTGRES_PASSWORD}@db:5432/mystina
    volumes:
      - media:/app/media
    ports:
      # Solo accesible desde el propio servidor; la publica Cloudflare Tunnel.
      - "127.0.0.1:${PUERTO_WEB:-3010}:3000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.scope=mystina

  db:
    image: postgres:16-alpine
    container_name: mystina-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mystina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mystina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystina"]
      interval: 10s
      retries: 10

  # Actualiza solo el contenedor "web" de este proyecto (scope "mystina"),
  # sin tocar los contenedores de Capse Carpfishing.
  watchtower:
    image: containrrr/watchtower
    container_name: mystina-watchtower
    restart: unless-stopped
    command: --scope mystina --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.scope=mystina

volumes:
  media:
  pgdata:
